server:
  port: 9000

spring:
  application:
    name: zuul-api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/authService/**
          filters:
            - StripPrefix=1

eureka:
  client:
    enabled: true
    serviceUrl:
      defaultZone: http://localhost:8100/eureka