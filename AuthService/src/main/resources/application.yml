server:
  port: 8001

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mariadb://localhost:3306/remylia_auth
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      idle-timeout: 10000
      minimum-idle: 5
      connection-timeout: 15000
      pool-name: hikari-pool
      max-lifetime: 60000

eureka:
  client:
    enabled: true
    serviceUrl:
      defaultZone: http://localhost:8100/eureka